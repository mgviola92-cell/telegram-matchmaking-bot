name: Python checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Run offline regression checks
        run: python -m unittest discover -s tests -v

  postgres-migration-qa:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: matchmaking_migration_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d matchmaking_migration_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      RUN_POSTGRES_MIGRATION_TESTS: "1"
      MIGRATION_TEST_DATABASE_URL: "postgresql://test:test@127.0.0.1:5432/matchmaking_migration_test"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Exercise real PostgreSQL migrations and opt-in reminders
        run: python -m unittest discover -s tests -p 'test_postgres_migration.py' -v
